[project]
name = "task-mcp"
version = "0.1.0"
description = "An MCP server for managing a personal to-do list in SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
]

[project.scripts]
task-mcp = "task_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
